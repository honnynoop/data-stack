server {
    listen 80;
    server_name localhost;

    # ── 정적 파일 (포털 HTML) ──────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 헬스체크 프록시 (서버 사이드 → CORS 없음) ──────
    # 브라우저가 /health/XXX 를 호출하면 nginx가
    # Docker 내부망 서비스명으로 직접 요청 → 응답 반환

    location /health/airflow {
        proxy_pass         http://airflow-webserver:8080/health;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        # 502/504 등 오류 시 JSON 반환
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_down;
    }

    location /health/pgadmin {
        proxy_pass         http://pgadmin:80/misc/ping;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_down;
    }

    location /health/superset {
        proxy_pass         http://superset:8088/health;
        proxy_read_timeout 8s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_down;
    }

    location @service_down {
        default_type application/json;
        return 503 '{"status":"down"}';
    }
}
