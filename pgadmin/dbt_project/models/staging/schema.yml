version: 2

models:
  - name: stg_customers
    description: "정제된 고객 데이터 (staging)"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]

  - name: stg_products
    description: "정제된 상품 데이터 - 마진율 포함 (staging)"
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: price
        tests: [not_null]
      - name: margin_rate
        description: "마진율 (%)"

  - name: stg_orders
    description: "정제된 주문 데이터 - 매출액/날짜 파생 컬럼 포함 (staging)"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: total_amount
        description: "주문 총액 (quantity × unit_price)"
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'refunded', 'pending']
      - name: is_revenue
        description: "completed 상태만 true (매출 인식 플래그)"
